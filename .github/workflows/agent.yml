name: Run AI Video Script Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Main AI Video Script
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          python main.py

      - name: Create Production Output Directory
        run: |
          mkdir -p production_output
          echo "Pipeline finished successfully!" > production_output/result.txt

      - name: Upload Production Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-production-bundle
          path: production_output/