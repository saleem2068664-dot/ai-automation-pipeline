name: AI Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Blender and Headless OpenGL Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1

      - name: Verify Blender Installation
        run: |
          blender --version

      - name: Run Blender Headless Render Test
        run: |
          mkdir -p output
          xvfb-run blender -b -P render_script.py -- python-expr "print('Blender Headless Engine Verified!')"