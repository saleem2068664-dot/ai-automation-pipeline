name: AI Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Blender and Headless OpenGL Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1

      - name: Verify Blender Installation
        run: |
          blender --version

      - name: Generate Synchronized Audio & SFX Bed
        run: |
          python generate_audio.py

      - name: Render Blender Video
        run: |
          mkdir -p output
          python main.py

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-render-video
          path: output/
          retention-days: 7