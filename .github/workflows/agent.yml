name: Continuous AI Video Automation Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv gTTS google-generativeai

      - name: Execute Main AI Video Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add production_output/ || true
          git commit -m "Auto-commit generated AI production bundle [skip ci]" || true
          git push || true