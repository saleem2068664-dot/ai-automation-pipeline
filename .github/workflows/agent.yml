name: AI Video Automation Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install opencv-python numpy edge-tts requests replicate

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render AI Video
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          mkdir -p output
          python main.py

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-render-video
          path: output/final_video.mp4
          retention-days: 7