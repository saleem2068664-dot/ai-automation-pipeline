name: Run Blender 3D Animation Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Blender and System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Blender 3D Video Generation Script
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          python main.py

      - name: Create Production Output Directory
        run: |
          mkdir -p production_output

      - name: Upload Production Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-production-bundle
          path: production_output/