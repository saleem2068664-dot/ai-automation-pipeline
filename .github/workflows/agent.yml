
name: AI Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System OpenGL, Xvfb & Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb libgl1-mesa-dri libgl1 libegl1 libosmesa6

      - name: Render 3D Video with Virtual Framebuffer
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output/frames
          xvfb-run -a -s "-screen 0 1280x720x24" python main.py

      - name: Upload Rendered Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-render-video
          path: output/
          retention-days: 7
