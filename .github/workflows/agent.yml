name: AI Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install opencv-python numpy

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render Ancient Animation Video
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output/frames
          python main.py

      - name: Upload Rendered Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-render-video
          path: output/
          retention-days: 7